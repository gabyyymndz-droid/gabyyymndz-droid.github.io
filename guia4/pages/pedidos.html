<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Pedidos - Cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../js/pedidos.js" defer></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Gestión de Pedidos de Cafetería</h1>
        
        <div class="card mb-4">
            <div class="card-body">
                <form id="formPedido" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Producto</label>
                        <input type="text" id="inputProducto" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Precio Unitario ($)</label>
                        <input type="number" id="inputPrecio" class="form-control" step="0.01" min="0.01" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" id="inputCantidad" class="form-control" min="1" step="1" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="button" id="btnAgregar" class="btn btn-primary w-100">Agregar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6 d-flex gap-2">
                <input type="number" id="inputFiltroPrecio" class="form-control" placeholder="Precio máximo" step="0.01">
                <button type="button" id="btnFiltrar" class="btn btn-secondary">Filtrar</button>
                <button type="button" id="btnMostrarTodos" class="btn btn-outline-secondary">Mostrar Todos</button>
            </div>
            <div class="col-md-6 text-end">
                <button type="button" id="btnLimpiar" class="btn btn-danger">Limpiar Pedidos</button>
            </div>
        </div>

        <table class="table table-striped table-bordered bg-white">
            <thead class="table-dark">
                <tr>
                    <th>Producto</th>
                    <th>Precio Unitario</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody id="tablaPedidosBody">
            </tbody>
            <tfoot>
                <tr class="fw-bold">
                    <td colspan="2" class="text-end">Totales:</td>
                    <td id="totalUnidades">0</td>
                    <td id="montoTotal">$0.00</td>
                </tr>
            </tfoot>
        </table>
        <a href="../index.html" class="btn btn-link">Regresar al inicio</a>
    </div>
</body>
</html>
